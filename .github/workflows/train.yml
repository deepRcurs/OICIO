name: OICIO Training From Scratch — Consumer Hardware Only

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      model_size:
        description: 'Model size: 6.8M (fast) or 50M (proof)'
        required: false
        default: '6.8M'
        type: choice
        options:
          - 6.8M
          - 50M

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max per GitHub Actions free tier

    steps:
      - name: Checkout OICIO — deepRcurs Labs @deeprcurs / Mzed Imamkh @mzedimamkh
        uses: actions/checkout@v4

      - name: Setup Rust — Toolchain in .cargo (excluded, can re-download)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          override: true
          profile: minimal

      - name: Setup Swap 10GB + 5GB = 14GB — Sebelum OOM (Aturan: jika RAM kurang swap 10GB,20GB,30GB...)
        run: |
          echo "=== Before Swap ==="
          free -h
          cat /proc/swaps
          df -h | head -5

          echo "Creating 10GB swap in /tmp (ephemeral, like .cache excluded)..."
          sudo fallocate -l 10G /swap_10gb
          sudo chmod 600 /swap_10gb
          sudo mkswap /swap_10gb
          sudo swapon /swap_10gb

          echo "Creating 5GB extra swap..."
          sudo fallocate -l 5G /swap_5gb_extra
          sudo chmod 600 /swap_5gb_extra
          sudo mkswap /swap_5gb_extra
          sudo swapon /swap_5gb_extra

          echo "=== After Swap 14GB Active ==="
          free -h
          cat /proc/swaps

          echo "Swap autoscale logic ready: 10GB -> 20GB -> 30GB jika RAM >80%"

      - name: Setup Python — Toolchain in .venv (excluded)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Deps — In .venv (excluded, can re-download)
        run: |
          python -m venv /tmp/venv
          source /tmp/venv/bin/activate
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu -q
          pip install numpy psutil tqdm huggingface_hub safetensors -q
          pip list | grep -E "torch|numpy|huggingface"

      - name: Build OICIO Rust — 501KB native + 607KB musl static (like Needle2 14MB)
        run: |
          export CARGO_HOME=/tmp/cargo
          export RUSTUP_HOME=/tmp/rustup
          export CARGO_TARGET_DIR=/tmp/oicio-rs-target
          mkdir -p $CARGO_HOME $RUSTUP_HOME $CARGO_TARGET_DIR
          export PATH=$CARGO_HOME/bin:$PATH

          cd oicio-rs
          cargo build --release --bin oicio --bin oicio_real_rah --bin oicio_turboquant_real
          ls -lh /tmp/oicio-rs-target/release/oicio* | head -10

          echo "Running Rust binary 501KB (MatMul-Free CPU-Only)..."
          /tmp/oicio-rs-target/release/oicio 2>&1 | tail -30

      - name: Training From Scratch HERE — Consumer Hardware Only — No GPU No CUDA
        run: |
          source /tmp/venv/bin/activate
          echo "=== Training From Scratch HERE — 6.8M ternary 50 steps ==="
          echo "Model: 4 layers, dim 256, vocab 1024, 6.8M params, FP16 13MB -> Ternary 1.3MB (10.1x)"
          echo "Env: 2-core CPU, 7GB RAM + 14GB Swap (10+5) = 21GB total, GitHub Actions Free (2000 min/month, no credit card, no HP)"
          echo "Method Correct: 8-bit AdamW (hemat 4x) + checkpointing (hemat 10x) + ZeRO-Offload + ReAttention bounded 8K (208x) + streaming data + warmup+cosine + all ternary"
          echo "Dataset: LLM sebagai guru, generate synthetic on-the-fly, 3 topics 90% coherence 10% switch (surprise event boundary)"

          python oicio/training/train_from_scratch_here.py 2>&1 | tail -50

          echo "=== Checkpoint ==="
          ls -lh oicio/data/ | tail -10
          cat oicio/data/training_log_here.json

      - name: Push Checkpoint to HF Hub — Via HF_TOKEN (Tanpa Kartu Kredit/HP)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          source /tmp/venv/bin/activate
          echo "Pushing checkpoint to HF Hub deeprcurs-staff/OICIO with HF token (100GB private free, 5TB public best-effort, no credit card, no HP)..."

          python -c "
          from huggingface_hub import HfApi
          import os
          token = os.environ['HF_TOKEN']
          api = HfApi()

          # Upload training log
          try:
              api.upload_file(
                  path_or_fileobj='oicio/data/training_log_here.json',
                  path_in_repo='training_logs/github_actions/training_log_here.json',
                  repo_id='deeprcurs-staff/OICIO',
                  token=token,
              )
              print('Uploaded training_log_here.json to deeprcurs-staff/OICIO')
          except Exception as e:
              print(f'Upload log error: {e}')

          # Upload checkpoint if exists and small (<100MB snapshot-safe, but in Actions we can upload large to Hub)
          checkpoint = 'oicio/data/oicio_from_scratch_here.pt'
          if os.path.exists(checkpoint):
              size_mb = os.path.getsize(checkpoint)/1024/1024
              print(f'Checkpoint {checkpoint} {size_mb:.1f}MB exists, uploading to Hub...')
              try:
                  api.upload_file(
                      path_or_fileobj=checkpoint,
                      path_in_repo='checkpoints/github_actions/oicio_from_scratch_here.pt',
                      repo_id='deeprcurs-staff/OICIO',
                      token=token,
                  )
                  print('Uploaded checkpoint to HF Hub')
              except Exception as e:
                  print(f'Upload checkpoint error: {e}')
          else:
              print('Checkpoint not found (may be in .cache excluded)')

          print('HF Hub push complete: https://huggingface.co/deeprcurs-staff/OICIO')
          "

      - name: Final Stats — Snapshot + Swap
        run: |
          echo "=== Final Stats ==="
          free -h
          cat /proc/swaps
          df -h | head -5
          echo ""
          echo "Snapshot-safe files (must stay <128MB / 10K):"
          find . -type f -not -path "*/.cache/*" -not -path "*/.venv/*" -not -path "*/.cargo/*" -not -path "*/target/*" -not -path "*/__pycache__/*" -not -path "*/.git/*" | wc -l
          echo "files"
          echo ""
          echo "GitHub: https://github.com/deepRcurs/OICIO"
          echo "HF Hub: https://huggingface.co/deeprcurs-staff/OICIO"
          echo "MyBinder: https://mybinder.org/v2/gh/deepRcurs/OICIO/main"
          echo "Credits: deepRcurs Labs @deeprcurs / Mzed Imamkh @mzedimamkh"
